backend:
  name: git-gateway
  branch: main

# This line will instruct Decap CMS to save files directly to GitHub without PRs.
publish_mode: simple

media_folder: "frontend/public/images/places"
public_folder: "/images/places"

collections:
  - name: "mekanlar"
    label: "Tüm Mekanlar"
    folder: "frontend/src/content/mekanlar"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Mekan Adı", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Gezilecek Yerler", "Oteller", "Mekanlar", "Plajlar"]}
      - {label: "Bölge/Semt", name: "region", widget: "string"}
      - {label: "Adres", name: "address", widget: "string", required: false}
      - {label: "Telefon", name: "phone", widget: "string", required: false}
      - {label: "Google Puanı", name: "rating", widget: "number", value_type: "float", min: 1, max: 5, required: false}
      - {label: "Değerlendirme Sayısı", name: "reviews_count", widget: "number", value_type: "int", required: false}
      - {label: "Fotoğraflar", name: "photos", widget: "list", field: {label: "Fotoğraf Linki/Yolu", name: "photo", widget: "image"}, required: false}
      - {label: "Google Maps URL", name: "google_maps_url", widget: "string", required: false}
      - {label: "Lokasyon", name: "location", widget: "object", required: false, fields: [
          {label: "Enlem (Lat)", name: "lat", widget: "number", value_type: "float"},
          {label: "Boylam (Lng)", name: "lng", widget: "number", value_type: "float"}
      ]}
      - {label: "Uzun Açıklama (Makale)", name: "body", widget: "markdown", required: false}

  - name: "rehber"
    label: "Gezi Rehberleri (Blog)"
    folder: "frontend/src/pages/rehber"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama (SEO)", name: "description", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "İçerik", name: "body", widget: "markdown"}
